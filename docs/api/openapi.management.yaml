      properties:
        egressIp: {type: string}
        country: {type: string}
        org: {type: string}
        verdict: {type: string, enum: [ok, misjudged, unknown]}
        redirect: {type: string, description: Redirect target evidencing the misjudgment; present only when verdict is misjudged.}
        error: {type: string}
