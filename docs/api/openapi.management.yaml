openapi: 3.1.0
info:
  title: Sing-box Ops Management API
  version: 2.0.0
  description: Management API for control-plane identity and managed resources.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8030
    description: Local development
tags:
  - name: Health
    description: Process liveness and control-plane readiness.
  - name: Authentication
    description: Session and password lifecycle.
  - name: Users
    description: Subscription user and credential lifecycle.
  - name: Subscriptions
    description: Public immutable subscription artifact distribution.
  - name: Protocols
    description: Typed inbound protocol management.
  - name: Certificates
    description: TLS certificate and encrypted private-key management.
  - name: Policies
    description: Ordered routing policies, rules, validation, and dry-run evaluation.
  - name: SingBox
    description: Managed sing-box server configuration, upstreams, and server-side routing rules.
  - name: Overview
    description: Control-plane resource and runtime summary.
  - name: Monitor
    description: Host-level server metrics (CPU, memory, disk, network) with recent trend history.
  - name: Audit
    description: Filtered security and resource audit trail.
  - name: Traffic
    description: Permanent traffic history, aggregation, archive, and explicit purge.
  - name: Events
    description: Authenticated resumable operations event stream.
  - name: Alerts
    description: Operational alerts and acknowledgement workflow.
  - name: System
    description: Panel self-upgrade against GitHub Releases.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process is running
      security: []
      responses:
        '200': {description: Process is live, content: {application/json: {schema: {$ref: '#/components/schemas/LivenessResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check database, schema, aggregation, alerts, and background tasks
      security: []
      responses:
        '200': {description: Control plane is ready, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '503': {description: Control plane is not ready, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessErrorResponse'}}}}
  /subscribe/{token}/{format}:
    get:
      tags: [Subscriptions]
      operationId: downloadSubscription
      summary: Download the current applied subscription artifact
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: format
          in: path
          required: true
          schema: {type: string, examples: [clash.yaml]}
      responses:
        '200':
          description: Immutable artifact from the current successful runtime synchronization
          headers:
            Subscription-Userinfo:
              schema: {type: string}
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            application/yaml:
              schema: {type: string}
            text/plain:
              schema: {type: string}
        '304': {description: Artifact has not changed}
        '404': {description: 'Token, synchronized artifact, or format not found'}
        '410': {description: 'User is disabled, expired, or over quota'}
  /api/v1/setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Determine whether the first administrator has been initialized
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '400':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '500':
          description: Setup status unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/v1/setup/admin:
    post:
      tags: [Setup]
      operationId: initializeAdmin
      summary: Create the first administrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminRequest'
      responses:
        '201':
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentPrincipal
      summary: Get the current principal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the current account password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityChangePasswordRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List subscription users
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: query, in: query, schema: {type: string}}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ResourceUserStatus'}
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt:asc, createdAt:desc, name:asc, name:desc, usedBytes:asc, usedBytes:desc]
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceUsersPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a subscription user and issue credentials once
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCreateUserRequest'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceUserMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a subscription user
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a subscription user using optimistic locking
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceUpdateUserRequest'}
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete an unreferenced subscription user
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: User deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/users/batch-status:
    post:
      tags: [Users]
      operationId: batchUpdateUserStatus
      summary: Enable or disable multiple users
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceBatchUserStatusRequest'}
      responses:
        '204': {description: Status updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/batch-quota:
    post:
      tags: [Users]
      operationId: batchAdjustUserQuota
      summary: Adjust traffic quota for multiple users (add delta or set absolute, all-or-nothing)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceBatchUserQuotaRequest'}
      responses:
        '204': {description: Quota updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/batch-protocols:
    post:
      tags: [Users]
      operationId: batchUpdateUserProtocols
      summary: Assign protocols to multiple users (set replaces, add appends, remove detaches, all-or-nothing)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceBatchUserProtocolsRequest'}
      responses:
        '204': {description: Protocol assignments updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/{id}/subscription/rotate:
    post:
      tags: [Users]
      operationId: rotateUserSubscription
      summary: Rotate the user-level subscription link (device credentials unaffected)
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Link rotated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subscriptionToken]
                properties:
                  subscriptionToken: {type: string, minLength: 32}
                  subscriptionBaseUrl: {type: string, description: Base URL for subscription links.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/{id}/devices:
    get:
      tags: [Users]
      operationId: listUserDevices
      summary: List a user's devices with decrypted subscription tokens
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDeviceList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Users]
      operationId: createUserDevice
      summary: Manually create an independent device for a user
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCreateDeviceRequest'}
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDeviceMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/users/{id}/devices/{did}:
    patch:
      tags: [Users]
      operationId: updateUserDevice
      summary: Enable or disable a device
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceDeviceUpdateRequest'}
      responses:
        '204': {description: Device updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Users]
      operationId: deleteUserDevice
      summary: Delete a device; its subscription token dies immediately
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/DeviceId'}]
      responses:
        '204': {description: Device deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/{id}/devices/{did}/credentials/rotate:
    post:
      tags: [Users]
      operationId: rotateUserDevice
      summary: Rotate a device's credential and return it once
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200':
          description: Device credential rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDeviceMutationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/{id}/traffic/reset:
    post:
      tags: [Users]
      operationId: resetUserTraffic
      summary: Reset used traffic to zero
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Traffic reset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/{id}/quota/adjust:
    post:
      tags: [Users]
      operationId: adjustUserQuota
      summary: Add to or set the traffic quota
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceTrafficAdjustmentRequest'}
      responses:
        '200': {description: Updated user, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {$ref: '#/components/schemas/ResourceUser'}}}]}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/protocol-schemas/{type}:
    get:
      tags: [Protocols]
      operationId: getProtocolSchema
      summary: Get server-defined fields and defaults for a protocol type
      security: [{BearerAuth: []}]
      parameters:
        - name: type
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ResourceProtocolType'}
      responses:
        '200':
          description: Protocol schema
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocolSchema'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/protocols/suggest-port:
    post:
      tags: [Protocols]
      operationId: suggestProtocolPort
      summary: Suggest an available listener port for a protocol transport
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocolPortSuggestionRequest'}}}
      responses:
        '200':
          description: Suggested listener port
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocolPortSuggestion'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/protocols/runtime-status:
    get:
      tags: [Protocols]
      operationId: listProtocolRuntimeStatus
      summary: Report per-protocol runtime state from a local listening-port probe and active connection counts
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Per-protocol runtime status, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {$ref: '#/components/schemas/ProtocolRuntimeStatusResult'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Runtime service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
  /api/v1/protocols/probe:
    post:
      tags: [Protocols]
      operationId: runProtocolProbe
      summary: Run an end-to-end probe now through each protocol inbound and persist the results
      security: [{BearerAuth: []}]
      parameters:
        - {name: protocolId, in: query, required: false, schema: {type: string, format: uuid}, description: 只拨测该协议；缺省为全部协议。}
      responses:
        '200': {description: 本轮拨测结果（单协议失败是数据不是错误）, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {$ref: '#/components/schemas/ProbeResult'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Runtime service unavailable or kernel not ready, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
  /api/v1/protocols/probe-results:
    get:
      tags: [Protocols]
      operationId: listProtocolProbeResults
      summary: List the latest persisted end-to-end probe result per protocol
      security: [{BearerAuth: []}]
      responses:
        '200': {description: 每协议最近一次拨测结果, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {$ref: '#/components/schemas/StoredProbeResults'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Runtime service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
  /api/v1/protocols:
    get:
      tags: [Protocols]
      operationId: listProtocols
      summary: List managed protocols
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Protocol list
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocolsResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Protocols]
      operationId: createProtocol
      summary: Create a typed protocol
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCreateProtocolRequest'}}}
      responses:
        '201':
          description: Protocol created
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocol'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/protocols/{id}:
    get:
      tags: [Protocols]
      operationId: getProtocol
      summary: Get a managed protocol
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProtocolId'}]
      responses:
        '200':
          description: Protocol detail with secrets masked
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocol'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Protocols]
      operationId: updateProtocol
      summary: Update a managed protocol using optimistic locking
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProtocolId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResourceUpdateProtocolRequest'}}}
      responses:
        '200':
          description: Protocol updated
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocol'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Protocols]
      operationId: deleteProtocol
      summary: Delete an unreferenced protocol
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProtocolId'}]
      responses:
        '204': {description: Protocol deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/protocols/{id}/clone:
    post:
      tags: [Protocols]
      operationId: cloneProtocol
      summary: Clone a protocol in disabled state
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProtocolId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCloneProtocolRequest'}}}
      responses:
        '201':
          description: Protocol cloned
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocol'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/protocols/{id}/rotate-secret:
    post:
      tags: [Protocols]
      operationId: rotateProtocolSecret
      summary: Rotate and return a protocol server secret once
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProtocolId'}]
      responses:
        '200':
          description: Secret rotated
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceProtocolSecretRotation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/certificates/self-signed:
    post:
