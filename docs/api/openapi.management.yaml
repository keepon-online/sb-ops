        lastFailedAt: {type: string, format: date-time}
        failureReason: {type: string}
        artifactCount: {type: integer, minimum: 0}
        connections: {$ref: '#/components/schemas/ManagementOverviewConnections'}
        traffic24h: {$ref: '#/components/schemas/TrafficSummary'}
        topUsers: {type: array, items: {$ref: '#/components/schemas/TrafficRanking'}}
        lastTrafficCollectedAt:
          type: string
          format: date-time
          description: When the traffic collection loop last completed a successful cycle; absent before the first successful collection.
        bandwidth:
          $ref: '#/components/schemas/ManagementOverviewBandwidth'
        egressGeo:
          $ref: '#/components/schemas/ManagementOverviewEgressGeo'
        warpHealth:
          $ref: '#/components/schemas/ManagementOverviewWarpHealth'
    ManagementOverviewWarpHealth:
      type: object
      additionalProperties: false
      required: [verdict, degraded, checkedAt]
      description: >-
        Health of the WARP MASQUE unlock chain: Google-domain traffic exits
        through the local official cloudflare-warp client (proxy-mode SOCKS5)
        fronted by the warp-masque SOCKS outbound. Each probe verifies the
        trace warp flag and Google's region verdict via a redirect-following-
        free GET through the proxy. Absent when no warp-masque outbound exists
        or before the first successful probe after startup. degraded covers
        both definitive unhealthy verdicts and the stale fallback (probes
        failing continuously past a threshold — e.g. a dead tunnel whose SOCKS
        listener still accepts — in which case verdict still shows the last
        successful one).
      properties:
        verdict:
          type: string
          enum: [ok, proxy-down, warp-off, misjudged]
          description: >-
            ok = tunnel up and Google treats the WARP exit as non-CN;
            proxy-down = local WARP proxy unreachable; warp-off = tunnel not
            active (trace warp=off); misjudged = Google redirects google.com to
            google.com.hk through the WARP exit. Under the stale fallback the
            verdict still reflects the last successful probe; check degraded.
        degraded:
          type: boolean
          description: True for any unhealthy verdict or the stale fallback (probes failing continuously past a threshold); drives the card badge and the alert.
        reason:
          type: string
          description: Chinese failure reason; present when verdict is not ok.
        exitFamily:
          type: string
          enum: [ipv4, ipv6]
          description: Address family of the WARP exit; Cloudflare assigns it inside the MASQUE tunnel, so IPv4-only hosts may get an IPv6 exit. Absent when unknown.
        checkedAt: {type: string, format: date-time}
    ManagementWarpRotateResult:
      type: object
      additionalProperties: false
      required: [verdict]
      description: >-
        Fresh WARP MASQUE chain verdict right after a rotation (same probe as
        the overview warpHealth snapshot; its checkedAt is not part of this
        response).
      properties:
        verdict: {type: string, enum: [ok, proxy-down, warp-off, misjudged]}
        reason: {type: string, description: Chinese failure reason; present when verdict is not ok.}
        warpOn: {type: boolean, description: Whether the trace reported warp=on.}
        exitFamily: {type: string, enum: [ipv4, ipv6], description: Address family of the WARP exit; absent when unknown.}
    ManagementOverviewBandwidth:
      type: object
      additionalProperties: false
      required: [usedBytes, totalBytes, percent, updatedAt]
      description: >-
        Provider-metered (SolusVM client API, billing basis) monthly VPS
        bandwidth. Covers all NIC traffic including host-side overhead — a
        different basis than traffic24h (tunnel traffic only). Absent when the
        solusvm config section is unset or the first poll has not succeeded yet.
      properties:
        usedBytes: {type: integer, format: int64, minimum: 0}
        totalBytes: {type: integer, format: int64, minimum: 0}
        percent: {type: number, minimum: 0, maximum: 100}
        updatedAt: {type: string, format: date-time}
    ManagementOverviewEgressGeo:
      type: object
      additionalProperties: false
      required: [verdict, checkedAt]
      description: >-
        Google's region verdict for the egress IP, probed every 30 minutes via
        a redirect-following-free GET to www.google.com. misjudged means Google
        currently treats the egress IP as CN (google.com redirects to
        google.com.hk, Gemini region-blocked); the verdict drifts periodically
        and typically self-heals within weeks. Absent before the first
        successful probe after startup.
      properties:
        verdict: {type: string, enum: [ok, misjudged]}
        checkedAt: {type: string, format: date-time}
        redirect: {type: string, description: Redirect target evidencing the misjudgment; present only when verdict is misjudged.}
    ManagementOverviewDevices:
      type: object
      additionalProperties: false
      required: [total, auto, activeDay, platforms]
      description: Fleet-wide device stats; activeDay counts devices whose subscription was fetched in the last 24 hours.
      properties:
        total: {type: integer, minimum: 0}
        auto: {type: integer, minimum: 0, description: Devices auto-discovered from subscription User-Agent fingerprints.}
        activeDay: {type: integer, minimum: 0, description: Devices seen in the last 24 hours.}
        platforms:
          type: object
          description: Device count per platform (windows/macos/linux/android/ios/unknown).
          additionalProperties: {type: integer, minimum: 0}
    ManagementMonitorStatus:
      type: object
      additionalProperties: false
      required: [ready, sampledAt, host, cpu, memory, disk, network, history]
      properties:
        ready: {type: boolean, description: False until the first sample completes after process start.}
        sampledAt: {type: string, format: date-time}
        host: {$ref: '#/components/schemas/MonitorHost'}
        cpu: {$ref: '#/components/schemas/MonitorCPU'}
        memory: {$ref: '#/components/schemas/MonitorMemory'}
        disk: {$ref: '#/components/schemas/MonitorDisk'}
        network: {$ref: '#/components/schemas/MonitorNetwork'}
        history:
          type: array
          description: Recent trend points oldest-first (5-second interval, last 10 minutes).
          items: {$ref: '#/components/schemas/MonitorPoint'}
    MonitorHost:
      type: object
      additionalProperties: false
      required: [hostname, os, platform, platformVersion, kernelVersion, kernelArch, virtualizationSystem, bootTime, uptimeSeconds]
      properties:
        hostname: {type: string}
        os: {type: string}
        platform: {type: string}
        platformVersion: {type: string}
        kernelVersion: {type: string}
        kernelArch: {type: string}
        virtualizationSystem: {type: string}
        bootTime: {type: integer, format: int64, description: Unix seconds.}
        uptimeSeconds: {type: integer, format: int64, minimum: 0}
    MonitorCPU:
      type: object
      additionalProperties: false
      required: [logicalCores, physicalCores, modelName, usagePercent, perCore, load1, load5, load15]
