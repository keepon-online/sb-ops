      parameters: [{name: name, in: path, required: true, schema: {type: string, pattern: '^sb-ops-backup-[0-9]{8}-[0-9]{6}\.db$'}}]
      responses:
        '200':
          description: Backup file stream; snapshots contain credential master keys, keep them safe
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/system/warp/rotate:
    post:
      tags: [System]
      operationId: rotateSystemWarp
      summary: Rotate the WARP MASQUE exit (disconnect + reconnect via sudo warp-cli, then re-probe immediately)
      description: >-
        Part of the WARP MASQUE unlock chain maintenance: severs and
        re-establishes the official cloudflare-warp tunnel so Cloudflare may
        assign a different exit, then polls the health probe until a definitive
        verdict. The request blocks until the re-probe settles (typically a few
        seconds, worst case about a minute).
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Fresh health verdict after rotation, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {$ref: '#/components/schemas/ManagementWarpRotateResult'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: No warp-masque outbound configured, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '409': {description: sudoers does not allow warp-cli for the panel runtime user, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '502': {description: Reconnect failed or the re-probe window expired without a definitive verdict, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
  /api/v1/system/restore:
    post:
      tags: [System]
      operationId: restoreSystemFromUploadedBackup
      summary: Upload a backup snapshot and restore it (validates, then swaps the database and restarts the panel)
      description: >-
        multipart/form-data with a single `file` field (max 256MB). The snapshot
        is validated synchronously (SQLite integrity, sb-ops schema, version not
        ahead of the running binary); a 200 response only means the restore was
        accepted — the panel then goes through graceful shutdown, swaps the
        database file (the previous one is kept as <db_path>.pre-restore for
        manual rollback) and restarts itself.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary, description: Backup snapshot produced by this panel (VACUUM INTO image)}
      responses:
        '200': {description: Restore accepted; the panel is restarting, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string}}}}}]}}}}
        '400': {description: "Uploaded file failed validation (not SQLite, not an sb-ops database, or schema ahead of the running binary)", content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: An upgrade or another restore is already in progress, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '413': {description: Upload exceeds the 256MB limit, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '500': {description: Failed to stage or trigger the restore, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
  /api/v1/system/backups/{name}/restore:
    post:
      tags: [System]
      operationId: restoreSystemBackup
      summary: Restore the panel database from an existing snapshot (copied to staging, then swap and restart)
      description: >-
        The snapshot stays in the backup list (it is copied, not moved). Same
        validation and restart semantics as the upload restore endpoint.
      security: [{BearerAuth: []}]
      parameters: [{name: name, in: path, required: true, schema: {type: string, pattern: '^sb-ops-backup-[0-9]{8}-[0-9]{6}\.db$'}}]
      responses:
        '200': {description: Restore accepted; the panel is restarting, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {properties: {data: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string}}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: An upgrade or another restore is already in progress, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
        '500': {description: Failed to stage or trigger the restore, content: {application/json: {schema: {$ref: '#/components/schemas/ManagementErrorResponse'}}}}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementErrorResponse'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementErrorResponse'
    Forbidden:
      description: Password change or permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementErrorResponse'
    Conflict:
      description: Revision, username, or last-admin conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementErrorResponse'
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementErrorResponse'
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Subscription user UUID
      schema: {type: string, format: uuid}
    DeviceId:
      name: did
      in: path
      required: true
      description: Device UUID
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ProtocolId:
      name: id
      in: path
      required: true
      description: Protocol UUID
      schema: {type: string, format: uuid}
    CertificateId:
      name: id
      in: path
      required: true
      description: Certificate UUID
      schema: {type: string, format: uuid}
    PolicyId:
      name: id
      in: path
      required: true
      description: Policy UUID
      schema: {type: string, format: uuid}
    RuleId:
      name: ruleId
      in: path
      required: true
      description: Rule UUID
      schema: {type: string, format: uuid}
  schemas:
    SetupStatusResponse:
      type: object
      additionalProperties: false
      required: [initialized]
      properties:
        initialized:
          type: boolean
    SetupAdminRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 10
    IdentityAccount:
      type: object
      additionalProperties: false
      required: [id, username, enabled, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IdentityPrincipal:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    IdentityLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    IdentityLoginResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/IdentityAccount'
    IdentityMeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/IdentityPrincipal'
    IdentityChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 10
    ResourceUserStatus:
      type: string
      enum: [active, disabled, expired, quotaExceeded]
    ResourceIssuedCredential:
      type: object
      additionalProperties: false
      required: [deviceId, token, uuid, password]
      properties:
        deviceId: {type: string, format: uuid}
        token: {type: string, minLength: 32}
        uuid: {type: string, format: uuid}
        password: {type: string, minLength: 16}
    ResourceDevice:
      type: object
      additionalProperties: false
      required: [id, name, enabled, usedBytes, token, uuid, auto, platform, client, clientVersion, rotatedAt, createdAt]
      description: One device = an independent credential and subscription link; inbound users are named by device id so V2Ray stats attribute traffic per device.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        usedBytes: {type: integer, format: int64, minimum: 0}
        token: {type: string, description: Decrypted subscription token for building the clash.yaml link.}
        uuid: {type: string, format: uuid}
        auto: {type: boolean, description: True when the device was auto-created from a subscription User-Agent fingerprint; the default device (user-level link) and manually added devices are false.}
        platform: {type: string, enum: [windows, macos, linux, android, ios, unknown]}
        client: {type: string, description: Latest observed subscription client name.}
        clientVersion: {type: string, description: Latest observed subscription client version.}
        sourceIp: {type: string, description: Normalized client source address observed on the latest subscription request; empty until the device is first seen.}
        lastSeenAt: {type: [string, 'null'], format: date-time, description: Latest observed subscription request time.}
        rotatedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    ResourceDeviceList:
      type: object
      additionalProperties: false
      required: [items, subscriptionToken, maxDevices]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceDevice'}
        subscriptionToken: {type: string, description: The user-level subscription link token; devices are auto-discovered when clients import it.}
        maxDevices: {type: integer, minimum: 1, description: Maximum number of devices allowed for this user.}
        subscriptionBaseUrl: {type: string, description: Base URL for subscription links.}
    ResourceCreateDeviceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: Device name}
    ResourceDeviceUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: New device name}
        enabled: {type: boolean}
    ResourceDeviceMutationResponse:
      type: object
      additionalProperties: false
      required: [device, credential]
      properties:
        device: {$ref: '#/components/schemas/ResourceDevice'}
        credential: {$ref: '#/components/schemas/ResourceIssuedCredential'}
    ResourceUser:
      type: object
      additionalProperties: false
      required: [id, name, enabled, status, quotaBytes, usedBytes, resetIntervalDays, protocolIds, policyIds, deviceCount, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        status: {$ref: '#/components/schemas/ResourceUserStatus'}
        quotaBytes: {type: integer, format: int64, minimum: 0}
        usedBytes: {type: integer, format: int64, minimum: 0}
        expiresAt:
          type: [string, 'null']
          format: date-time
        resetIntervalDays: {type: integer, minimum: 0}
        nextResetAt:
          type: [string, 'null']
          format: date-time
        protocolIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        policyIds:
          type: array
          maxItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        deviceCount: {type: integer, minimum: 0, description: Number of devices (independent credentials) under this user.}
        revision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ResourceCreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, enabled, quotaBytes, resetIntervalDays, protocolIds, policyIds]
      properties:
        name: {type: string, minLength: 1}
        enabled: {type: boolean}
        quotaBytes: {type: integer, format: int64, minimum: 0}
        expiresAt:
          type: [string, 'null']
          format: date-time
        resetIntervalDays: {type: integer, minimum: 0}
        protocolIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        policyIds:
          type: array
          maxItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
    ResourceUpdateUserRequest:
      allOf:
        - $ref: '#/components/schemas/ResourceCreateUserRequest'
        - type: object
          required: [revision]
          properties:
            revision: {type: integer, format: int64, minimum: 1}
    ResourceUsersPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceUser'}
        nextCursor: {type: string}
    ResourceUserMutationResponse:
      type: object
      additionalProperties: false
      required: [user, subscriptionToken]
      description: Creating a user only issues the user-level subscription link; devices appear when clients import it.
      properties:
        user: {$ref: '#/components/schemas/ResourceUser'}
        subscriptionToken: {type: string, minLength: 32}
        subscriptionBaseUrl: {type: string, description: Base URL for subscription links.}
    ResourceBatchUserStatusRequest:
      type: object
      additionalProperties: false
      required: [ids, enabled]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        enabled: {type: boolean}
    ResourceBatchUserQuotaRequest:
      type: object
      additionalProperties: false
      required: [ids, mode, bytes]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        mode: {type: string, enum: [add, set], description: Same semantics as single-user quota adjust.}
        bytes: {type: integer, format: int64, description: 'add: signed delta (refuses to go negative); set: absolute quota where 0 means unlimited.'}
    ResourceBatchUserProtocolsRequest:
      type: object
      additionalProperties: false
      required: [ids, mode, protocolIds]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        mode: {type: string, enum: [set, add, remove], description: 'set replaces all assignments (empty list clears them), add appends, remove detaches.'}
        protocolIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
    ResourceTrafficAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [mode, bytes]
      properties:
        mode: {type: string, enum: [add, set]}
        bytes: {type: integer, format: int64}
    ResourceProtocolType:
      type: string
      enum: [vless, vmess, hysteria2, tuic, anytls, shadowsocks, trojan]
    ResourceProtocolField:
      type: object
      additionalProperties: false
      required: [name, label, kind, group, required, secret]
      properties:
        name: {type: string}
        label: {type: string}
        kind: {type: string, enum: [text, password, number, select, boolean]}
        group: {type: string, enum: [basic, transport, tls, reality, security, advanced]}
        required: {type: boolean}
        secret: {type: boolean}
        options:
          type: array
          items: {type: string}
        hint: {type: string}
    ResourceProtocolSchema:
      type: object
      additionalProperties: false
      required: [type, fields, defaults, certificateRequired]
      properties:
        type: {$ref: '#/components/schemas/ResourceProtocolType'}
        fields:
          type: array
          items: {$ref: '#/components/schemas/ResourceProtocolField'}
        defaults:
          type: object
          additionalProperties: true
        certificateRequired: {type: boolean}
        certificateRequiredWhen:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    ResourceProtocolPortSuggestionRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/ResourceProtocolType'}
    ResourceProtocolPortSuggestion:
      type: object
      additionalProperties: false
      required: [listenPort]
      properties:
        listenPort: {type: integer, minimum: 1, maximum: 65535}
    ResourceProtocol:
      type: object
      additionalProperties: false
      required: [id, name, type, enabled, listen, listenPort, settings, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {$ref: '#/components/schemas/ResourceProtocolType'}
        enabled: {type: boolean}
        listen: {type: string}
        listenPort: {type: integer, minimum: 1, maximum: 65535}
        settings:
          type: object
          additionalProperties: true
        certificateId:
          type: [string, 'null']
          format: uuid
        revision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ResourceCreateProtocolRequest:
      type: object
      additionalProperties: false
      required: [name, type, enabled, listen, listenPort, settings]
      properties:
        name: {type: string, minLength: 1}
        type: {$ref: '#/components/schemas/ResourceProtocolType'}
        enabled: {type: boolean}
        listen: {type: string, default: '::'}
        listenPort: {type: integer, minimum: 1, maximum: 65535}
        settings:
          type: object
          additionalProperties: true
        certificateId:
          type: [string, 'null']
          format: uuid
    ResourceUpdateProtocolRequest:
      allOf:
        - $ref: '#/components/schemas/ResourceCreateProtocolRequest'
        - type: object
          required: [revision]
          properties:
            revision: {type: integer, format: int64, minimum: 1}
    ResourceCloneProtocolRequest:
      type: object
      additionalProperties: false
      required: [name, listenPort]
      properties:
        name: {type: string, minLength: 1}
        listenPort: {type: integer, minimum: 1, maximum: 65535}
    ResourceProtocolSecretRotation:
      type: object
      additionalProperties: false
      required: [protocol, field, value]
      properties:
        protocol: {$ref: '#/components/schemas/ResourceProtocol'}
        field: {type: string}
        value: {type: string}
    ResourceProtocolsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceProtocol'}
    ProtocolRuntimeStatusResult:
      type: object
      additionalProperties: false
      required: [kernelStatus, configStatus, listeningAvailable, connectionsAvailable, items]
      properties:
        kernelStatus: {type: string, enum: [running, stopped, unhealthy], description: 内核整体运行状态。}
        configStatus: {type: string, enum: [not_configured, pending, applied], description: 配置同步状态；pending 表示改动尚未应用到内核。}
        listeningAvailable: {type: boolean, description: 本地监听端口探测是否成功。}
        listeningReason: {type: string, description: 监听探测不可用原因。}
        connectionsAvailable: {type: boolean, description: Clash 连接观测是否可用。}
        connectionsReason: {type: string, description: 连接观测不可用原因。}
        items: {type: array, items: {$ref: '#/components/schemas/ProtocolRuntimeStatusItem'}}
    ProtocolRuntimeStatusItem:
      type: object
      additionalProperties: false
      required: [id, name, type, transport, enabled, listenPort, status, activeConnections]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {$ref: '#/components/schemas/ResourceProtocolType'}
        transport: {type: string, enum: [tcp, udp]}
        enabled: {type: boolean}
        listenPort: {type: integer, minimum: 1, maximum: 65535}
        status:
          type: string
          enum: [listening, not_listening, kernel_down, disabled, unknown]
          description: 监听端口与内核状态推导出的运行状态。
        activeConnections: {type: [integer, 'null'], minimum: 0, description: 该协议入站的活跃连接数；连接观测不可用时为 null。}
        portHop: {$ref: '#/components/schemas/ProtocolPortHopStatus'}
    ProtocolPortHopStatus:
      type: object
      additionalProperties: false
      required: [from, to, rule]
      properties:
        from: {type: integer, minimum: 1, maximum: 65535}
        to: {type: integer, minimum: 1, maximum: 65535}
        rule: {type: string, enum: [ok, missing, mismatched, unknown], description: iptables 端口跳跃规则与期望配置的比对结果。}
    ProbeResult:
      type: object
      additionalProperties: false
      required: [checkedAt, items]
      properties:
        checkedAt: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/ProbeResultItem'}}
    ProbeResultItem:
      type: object
      additionalProperties: false
      required: [protocolId, protocolName, status, checkedAt]
      properties:
        protocolId: {type: string, format: uuid}
        protocolName: {type: string}
        status:
          type: string
          enum: [ok, failed, skipped]
          description: ok=全链路通；failed=拨测失败（error 说明原因）；skipped=未拨测（停用/无凭据）。
        latencyMs: {type: [integer, 'null'], minimum: 0, description: 实测链路延迟；skipped 时为 null。}
        error: {type: string, description: failed 的错误原因或 skipped 的跳过原因。}
        checkedAt: {type: string, format: date-time}
    StoredProbeResults:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ProbeResultItem'}}
    ResourceCertificate:
      type: object
      additionalProperties: false
      required: [id, name, source, fingerprint, notBefore, notAfter, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        source: {type: string, enum: [self_signed, manual, acme]}
        domain: {type: string}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        notBefore: {type: string, format: date-time}
        notAfter: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ResourceCreateAcmeCertificateRequest:
      type: object
      additionalProperties: false
      required: [name, domain]
      properties:
        name: {type: string, minLength: 1}
        domain: {type: string, minLength: 1}
    ResourceCreateCertificateRequest:
      type: object
      additionalProperties: false
      required: [name, certificatePem, privateKeyPem]
      properties:
        name: {type: string, minLength: 1}
        certificatePem: {type: string, minLength: 1}
        privateKeyPem: {type: string, minLength: 1}
    ResourceCreateSelfSignedCertificateRequest:
      type: object
      additionalProperties: false
      required: [name, serverName]
      properties:
        name: {type: string, minLength: 1}
        serverName: {type: string, minLength: 1}
    ResourceRegenerateSelfSignedCertificateRequest:
      type: object
      additionalProperties: false
      required: [revision, serverName]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        serverName: {type: string, minLength: 1}
    ResourceUpdateCertificateRequest:
      allOf:
        - $ref: '#/components/schemas/ResourceCreateCertificateRequest'
        - type: object
          required: [revision]
          properties:
            revision: {type: integer, format: int64, minimum: 1}
    ResourceCertificatesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceCertificate'}
    ResourcePolicy:
      type: object
      additionalProperties: false
      required: [id, name, description, enabled, defaultAction, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        defaultAction: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ResourceCreatePolicyRequest:
      type: object
      additionalProperties: false
      required: [name, description, enabled, defaultAction]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        enabled: {type: boolean}
        defaultAction: {type: string, minLength: 1}
    ResourceUpdatePolicyRequest:
      allOf:
        - $ref: '#/components/schemas/ResourceCreatePolicyRequest'
        - type: object
          required: [revision]
          properties:
            revision: {type: integer, format: int64, minimum: 1}
    ResourceClonePolicyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
    ResourcePoliciesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ResourcePolicy'}}
    PolicyRuleSetOption:
      type: object
      additionalProperties: false
      required: [name, behavior]
      properties:
        name: {type: string}
        behavior: {type: string, enum: [domain, ipcidr, classical]}
    PolicyRuleSetsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PolicyRuleSetOption'}}
    ResourcePolicyConditions:
      type: object
      additionalProperties: false
      properties:
        domains: {type: array, uniqueItems: true, items: {type: string}}
        domainSuffixes: {type: array, uniqueItems: true, items: {type: string}}
        ipCidrs: {type: array, uniqueItems: true, items: {type: string}}
        ruleSets: {type: array, uniqueItems: true, items: {type: string}}
        ports: {type: array, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
        networks: {type: array, uniqueItems: true, items: {type: string, enum: [tcp, udp]}}
        protocols: {type: array, uniqueItems: true, items: {type: string}}
    ResourcePolicyRule:
      type: object
      additionalProperties: false
      required: [id, policyId, name, enabled, priority, conditions, action, noResolve, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        policyId: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0}
        conditions: {$ref: '#/components/schemas/ResourcePolicyConditions'}
        action: {type: string}
        noResolve: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
