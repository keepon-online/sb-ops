      type: object
      additionalProperties: false
      required: [verdict]
      description: >-
        Immediate egress health check for a freshly registered WARP identity,
        probed through a one-off lightweight client kernel (mixed inbound + the
        identity's wireguard endpoint). misjudged means Google currently treats
