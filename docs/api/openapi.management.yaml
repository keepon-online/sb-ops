      properties:
        code: {type: string, const: NOT_READY}
        message: {type: string}
        requestId: {type: string, format: uuid}
        status: {type: string, const: not_ready}
      description: 未就绪响应不携带组件明细（checks 仅出现在 200 就绪响应中，避免向未认证方泄露运营侦察信息）。
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, requestId]
      description: 管理 API 统一成功响应信封；各端点通过 allOf 覆盖 data 的具体类型。
      properties:
        code: {type: integer, const: 0, description: 业务状态码，0 表示成功}
        message: {type: string, example: success}
        data: {description: 业务数据，类型由具体端点决定}
        requestId: {type: string, format: uuid}
    ManagementErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, requestId]
      description: 管理 API 统一错误响应信封；HTTP 状态码保持 REST 语义，code 为数字业务码。
      properties:
        code:
          type: integer
          description: |
            业务状态码（注册表见后端 internal/httpx/codes.go，发布后只增不改）：
            1001 参数校验失败、1002 内部服务器错误、1003 资源不存在、1004 流量查询参数无效、
            2001 未登录或会话失效、2002 用户名或密码错误、2003 密码不符合要求、2004 登录尝试过于频繁、
            2005 管理员已初始化、2006 用户名已存在、3001 资源已被修改、3002 资源正在被引用、
            3003 名称已存在、3004 凭据需先轮换、4001 升级源未配置、4002 查询 GitHub 最新版本失败、
            4003 已有升级正在进行、4004 当前已是最新版本、5001 sing-box 运行时尚未配置、
            5002 sing-box 运行时操作失败、5003 sing-box 配置同步失败。
          enum: [1001, 1002, 1003, 1004, 2001, 2002, 2003, 2004, 2005, 2006, 3001, 3002, 3003, 3004, 4001, 4002, 4003, 4004, 5001, 5002, 5003]
        message:
          type: string
        data: {type: 'null'}
        fieldErrors:
          description: 字段级中文校验消息；键为请求体的 JSON 字段名。仅在 code 为 1001 且绑定 tag 校验未通过时返回，请求体格式错误时不出现。
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
