# sb-ops 配置样例（复制为工作目录下的 config.yaml 后按环境修改）。
# 仅保留与默认值不同的键；其余键及默认值见 internal/config/runtime.go 的 DefaultRuntimeConfig。
# 可选段(未配置时自动禁用):notifications(告警外发)、acme(证书签发)、
# updates(面板自升级,repo+token)、traffic.retention_days(默认 90)、
# audit.retention_days(审计日志保留,默认 180;0 均为永久保留)、probe(拨测目标与周期)、
# certificates.expiry_warning(证书到期提醒阈值,默认 30 天)、
# solusvm(VPS 月流量计量,RackNerd 的 nerdvm 面板即是 SolusVM 1)。
# notifications（可选）：告警外发，支持通用 Webhook / Telegram / 国内文本机器人，
# 各渠道按需配置、并行发送。机器人 URL 与密钥 / token 属敏感配置，只放本文件，勿提交。
# notifications:
#   webhook_url: ""
#   webhook_secret: ""
#   telegram_bot_token: ""
#   telegram_chat_id: ""
#   feishu_webhook_url: "" # 飞书机器人；开启签名校验时填 feishu_secret
#   feishu_secret: ""
#   dingtalk_webhook_url: "" # 钉钉机器人；开启加签时填 dingtalk_secret
#   dingtalk_secret: ""
#   wecom_webhook_url: "" # 企业微信群机器人
server:
  listen: ":8030"
  # 默认在 data_dir(./data)下建库;如需放仓库根可显式指定。
  # db_path: "./singbox-web.db"

# 日志:控制台固定彩色文本;level 同时作用于控制台与文件。
# file_format 为文件落盘格式——text(无颜色可读文本,默认)/json。
logging:
  level: "info"
  file_format: "text"

deployment:
  # 客户端拨打的地址,用于订阅与证书生成(公网 IPv4 或域名)。
  public_address: "203.0.113.10"
  # 可选：面板自环保护域名，用于当 public_address 为 IP 时防自环。
  # panel_domain: "panel.example.com"
  # 可选：对外分发的订阅根地址（支持独立域名、CDN 域名或特定端口，如 "https://sub.example.com"）。
  # 配置后订阅链接一律使用此基准地址；未配置时自动回退为当前请求 Host。
  # subscription_url_base: ""

# 可选：协议端到端拨测。默认目标为 gstatic 204，默认每 5 分钟一轮。
# probe:
#   target_url: "http://www.gstatic.com/generate_204"
#   interval: "5m"
# certificates:
#   expiry_warning: "720h" # 30 天

# 可选：VPS 月流量计量（提供商账单口径，RackNerd 的 nerdvm 即 SolusVM 1）。
# 三项须同时提供；key/hash 在面板「API」标签页生成，注意该凭据同时具备
# 重启这台 VPS 的权限——只写入本文件（0600、已 gitignore），勿提交入库。
# 配置后总览页展示本月用量，用量达 80%/95% 与拉取持续失败会产生告警。
# solusvm:
#   endpoint: "https://nerdvm.racknerd.com/api/client/command.php"
#   api_key: ""
#   api_hash: ""

# 本机/局域网开发测试时可临时开启,把私网/回环地址当作 public_address;
# 正式对外部署必须删除 development 段(默认不存在)。
# development:
#   allow_private_address: true
