name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    # 钉 22.04：ubuntu-latest 滚到 25.04 后发行版 gcc 默认按 x86-64-v2/v3 编译
    # CGO 部分，老 VPS CPU 加载即拒（CPU ISA level is lower than required，exit 127）。
    # 与 Makefile 里 amd64 的 CGO_CFLAGS=-march=x86-64 双保险。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install ARM64 build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release artifacts
        run: make release VERSION="${GITHUB_REF_NAME}"

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
