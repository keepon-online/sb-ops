name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: make test
      - run: make vet
      - run: go build -tags=with_quic,with_utls,with_clash_api,with_v2ray_api,with_wireguard,with_gvisor -ldflags=-checklinkname=0 .
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 binary 需要 action v7+ 才能识别（v6 会拒绝 v2 版本号）。
          # 项目用 v2 是因为 go 1.27 模块需要 built with Go 1.27+ 的 binary（v2.4.0 曾拒绝 go 1.27.0 模块）。
          version: v2.15.0
          args: --timeout=5m
          # 禁用跨 run 的内部分析缓存（~/.cache/golangci-lint 的恢复/保存）：
          # 该缓存有已知 bug——「cache and facts」污染会让 staticcheck SA5011 在
          # 测试文件里随机误报且重跑无效（golangci/golangci-lint#5979，2026-08
          # 曾致 master 连续假红，本地干净缓存可证 0 issues）。同一次 job 内
          # go build 缓存已被前面的 make test/vet 暖热，跳过几乎无代价。
          skip-cache: true
      - run: test -z "$(gofmt -l ./*.go ./api ./internal)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:lint
      - run: npm run api:check
      - run: npm test -- --run
      - run: npm run build

  subscription-dialect:
    # 订阅方言门禁：生成的 clash.yaml 过一遍真实 mihomo 内核的 `mihomo -t`
    # （深度校验——协议字段加密格式、RULE-SET 悬空引用都会拒载；首次实弹
    # 即捕获 defaultClashRules 的 cn-domains 悬空引用与 fixture 占位公钥）。
    # 这是 SB_CHECK_DUMP/sing-box check 在订阅侧的对应物，把「mihomo 内核
    # 方言变化导致订阅非法」从用户报障提前到 CI 红灯。实测行为（2026-10，
    # mihomo v1.19.33）：`-t` 会因 dns.nameserver-policy 的 geosite: key 自动
    # 下载 GeoSite.dat（GH runner 秒级）；不拉取 rule-provider（39 个规则集
    # 纯引用校验、零下载）。mihomo 升级波次时同步更新下方 MIHOMO_VERSION
    # （compatible 构建 = GOAMD64=v1，runner 老 CPU 也稳）。
    runs-on: ubuntu-latest
    env:
      MIHOMO_VERSION: v1.19.33
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: |
          curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz" \
            | gunzip > mihomo
          chmod +x mihomo
          ./mihomo -v
      - run: |
          SB_SUB_DUMP="$PWD/clash.yaml" go test \
            -tags=with_quic,with_utls,with_clash_api,with_v2ray_api,with_wireguard,with_gvisor \
            -run TestDumpClashSubscriptionForExternalCheck ./internal/deployment/compiler
      - run: ./mihomo -t -d "$PWD/.mihomo-home" -f clash.yaml
        timeout-minutes: 5

  leaks:
    # 真实标识防回流门禁：全历史 gitleaks 扫描。只改快照不清历史的「假脱敏」
    # 提交在此必红（重写清过的值又出现在任何提交的 diff 里即命中）。规则存
    # repo secret LEAK_RULES——规则字面量本身就是被清除的真实标识，不能进
    # 仓库（否则开源时等于原样发布），正本在维护机 ~/.local/share/sb-ops/
    # leak-rules.toml。fork PR 拿不到 secret，跳过。--redact 必须保留：
    # 命中值不得回显进（开源后公开的）CI 日志。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          # 规则含大量 TOML 双引号，必须经 env 注入——内联 ${{ secrets.* }}
          # 会被引号截断脚本。
          printf '%s' "$LEAK_RULES" > leak-rules.toml
          gitleaks detect --source . --config leak-rules.toml --redact --verbose
        env:
          LEAK_RULES: ${{ secrets.LEAK_RULES }}
