name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - run: make test
      - run: make vet
      - run: go build -tags=with_quic,with_utls,with_clash_api,with_v2ray_api,with_wireguard,with_gvisor -ldflags=-checklinkname=0 .
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 binary 需要 action v7+ 才能识别（v6 会拒绝 v2 版本号）。
          # 项目用 v2 是因为 go 1.25 模块需要 v2 构建的 binary。
          version: v2.4.0
          args: --timeout=5m
          # 禁用跨 run 的内部分析缓存（~/.cache/golangci-lint 的恢复/保存）：
          # 该缓存有已知 bug——「cache and facts」污染会让 staticcheck SA5011 在
          # 测试文件里随机误报且重跑无效（golangci/golangci-lint#5979，2026-08
          # 曾致 master 连续假红，本地干净缓存可证 0 issues）。同一次 job 内
          # go build 缓存已被前面的 make test/vet 暖热，跳过几乎无代价。
          skip-cache: true
      - run: test -z "$(gofmt -l ./*.go ./api ./internal)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:lint
      - run: npm run api:check
      - run: npm test -- --run
      - run: npm run build

  leaks:
    # 真实标识防回流门禁：全历史 gitleaks 扫描。只改快照不清历史的「假脱敏」
    # 提交在此必红（重写清过的值又出现在任何提交的 diff 里即命中）。规则存
    # repo secret LEAK_RULES——规则字面量本身就是被清除的真实标识，不能进
    # 仓库（否则开源时等于原样发布），正本在维护机 ~/.local/share/sb-ops/
    # leak-rules.toml。fork PR 拿不到 secret，跳过。--redact 必须保留：
    # 命中值不得回显进（开源后公开的）CI 日志。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          # 规则含大量 TOML 双引号，必须经 env 注入——内联 ${{ secrets.* }}
          # 会被引号截断脚本。
          printf '%s' "$LEAK_RULES" > leak-rules.toml
          gitleaks detect --source . --config leak-rules.toml --redact --verbose
        env:
          LEAK_RULES: ${{ secrets.LEAK_RULES }}
